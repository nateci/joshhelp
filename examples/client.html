<!doctype html>
<!-- Minimal example of the app side: the app owns the camera/face-scan UI and just
     POSTs the three images to the API. Serve this file over http(s)/localhost so the camera works. -->
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ID Verify Demo</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 520px; margin: 24px auto; padding: 0 16px; }
    video, canvas { width: 100%; border-radius: 12px; background: #111; }
    .oval { position: relative; }
    .oval::after { content: ""; position: absolute; inset: 10% 25%; border: 3px dashed #fff8; border-radius: 50%; }
    label { display: block; margin: 12px 0 4px; font-weight: 600; }
    button { margin-top: 12px; padding: 10px 16px; font-size: 16px; }
    pre { background: #f4f4f4; padding: 12px; overflow-x: auto; }
  </style>
</head>
<body>
  <h2>Verify your identity</h2>
  <label>API URL</label>
  <input id="api" value="http://localhost:8000" style="width:100%" />

  <label>Front of ID</label>
  <input id="front" type="file" accept="image/*" capture="environment" />
  <label>Back of ID (barcode)</label>
  <input id="back" type="file" accept="image/*" capture="environment" />

  <label>Selfie</label>
  <div class="oval"><video id="video" autoplay playsinline muted></video></div>
  <canvas id="canvas" hidden></canvas>
  <button id="snap">Take selfie</button>
  <button id="send" disabled>Verify</button>
  <pre id="out"></pre>

<script>
  const video = document.getElementById("video"), canvas = document.getElementById("canvas");
  let selfie = null;

  navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
    .then(s => video.srcObject = s)
    .catch(e => out.textContent = "Camera error: " + e.message);

  snap.onclick = () => {
    canvas.width = video.videoWidth; canvas.height = video.videoHeight;
    canvas.getContext("2d").drawImage(video, 0, 0);
    canvas.toBlob(b => { selfie = b; send.disabled = false; canvas.hidden = false; }, "image/jpeg", 0.92);
  };

  send.onclick = async () => {
    const fd = new FormData();
    fd.append("id_front", front.files[0]);
    fd.append("id_back", back.files[0]);
    fd.append("selfie", selfie, "selfie.jpg");
    out.textContent = "Verifying...";
    const r = await fetch(api.value + "/verify", { method: "POST", body: fd });
    out.textContent = JSON.stringify(await r.json(), null, 2);
  };
</script>
</body>
</html>
